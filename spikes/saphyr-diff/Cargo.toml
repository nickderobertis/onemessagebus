# Throwaway differential harness for the serde-saphyr spike: reads this
# repository's real YAML with serde_norway (what the crate uses today) and with
# serde-saphyr / saphyr, and prints every difference. Never published or landed.
[package]
name = "saphyr-diff"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
onemessagebus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
serde_norway = { workspace = true }
serde-saphyr = "=1.3.0"
# The code-change reproduction: the key path serde_norway prefixes an error with.
serde_path_to_error = "0.1"
saphyr = "=0.2.1"
