version: 1
transport: {kind: local, dir: "/tmp/.tmpHaRk2s/bus"}
profile: desk
schemas:
  - "/repo/crates/onemessagebus-e2e/tests/layouts/desk.json@1"
  - "file:///tmp/.tmpHaRk2s/example-frames.json@3"
codecs:
  example:
    queue: questions
    reply_window_seconds: 1
    session_env: EXAMPLE_SESSION
    asker_env: EXAMPLE_ASKER
    about_env: EXAMPLE_ABOUT
    select: op
    frames:
      hello:
        schema: example.frame.hello@3
        bindings:
          - when: {field: mood, equals: lost}
            do: refuse
            message: "lost: {frame.value}"
          - do: answer
            response:
              value: "{frame.value}"
              text: "value={frame.value}"
              nested: {items: ["{{", "missing={frame.missing}"], object: {close: "}}"}}
      raise:
        schema: example.frame.hello@3
        bindings:
          - do: raise
            record: {kind: example-raised, blocking: false, source: example, message: "raised {frame.value}"}
            response: {raised: true}
      fail:
        schema: example.frame.hello@3
        bindings:
          - do: raise
            record: {kind: example-failed, blocking: false, source: example, message: "failed {frame.value}"}
            fail: "member failed {frame.value}"
      refuse:
        schema: example.frame.hello@3
        bindings:
          - do: refuse
            message: "refused {frame.value}"
      conditional:
        schema: example.frame.hello@3
        bindings:
          - when: {field: mood, equals: ready}
            do: answer
            response: {ready: true}
      ask:
        schema: example.frame.hello@3
        bindings:
          - do: ask
            record: {kind: example-question, source: example, message: "rule on {frame.value}"}
            response:
              value: {from: reply.completion}
              reason: {from: [reply.reason, reply.message], default: "ruled on {frame.value} without a reason"}
              literal: "{reply.completion}"
            unanswered: {value: false, reason: "no ruling for {frame.value}"}
