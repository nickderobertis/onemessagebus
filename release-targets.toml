# What this repository publishes, and the name each registry serves it under.
#
# The canonical release-target declaration (`onevcs`'s schema, version 3): one
# `[[target]]` per artifact a consumer names in order to depend on it, with the
# short `name` a host document waits on it by, and `probe` naming the script that
# answers what a registry serves for one of them. `scripts/release-probe.sh`
# answers exactly three ways — a version, nothing (no release yet), or not
# answered — and `npm/test/release-targets.test.mjs` holds this file to the
# release configuration in both directions, while
# `crates/onemessagebus-repo/tests/release_declaration.rs` holds it to the schema
# through `onevcs`'s own reader.
#
# The `onemessagebus` binary is built from the unpublished `onemessagebus-cli`
# crate, which is not a target: nothing depends on it by name. It reaches
# consumers as the PyPI wheel and the npm launcher below, and as
# `cargo install --git`.
schema_version = 3
probe = "scripts/release-probe.sh"

[[target]]
id = "crate:onemessagebus"
name = "crate"
what = "The onemessagebus core library — the envelope, filter grammar, payload bounds, redaction, schema registry, emitter and reader, generic over a vocabulary — as a Rust dependent takes it with `cargo add onemessagebus`."
published_by = "release.yml's `publish-crate` job, on the GitHub Release release-plz cuts, under crates/onemessagebus/Cargo.toml's [package] name."
manifest = "crates/onemessagebus/Cargo.toml"

[[target]]
id = "crate:onemessagebus-agent"
name = "agent-crate"
what = "The agent profile over the core — the agent stack's sources, phases, labels, filter and registered schema families — as a Rust dependent takes it with `cargo add onemessagebus-agent`. Shares the workspace version with the core, so one release moves both."
published_by = "release.yml's `publish-crate` job, after the core, under crates/onemessagebus-agent/Cargo.toml's [package] name."
manifest = "crates/onemessagebus-agent/Cargo.toml"

[[target]]
id = "pypi:onemessagebus-cli"
name = "pypi"
what = "The standalone `onemessagebus` binary as per-platform wheels, installed with `pip install onemessagebus-cli`."
published_by = "release.yml's `publish-pypi` job, from the wheels `build-wheels` assembles with maturin from pyproject.toml's [project] name."
manifest = "pyproject.toml"

[[target]]
id = "npm:onemessagebus-cli"
name = "npm"
what = "The `onemessagebus` binary as an npm launcher, installed with `npm install -g onemessagebus-cli`, resolving one of the per-platform packages it covers."
published_by = "release.yml's `publish-npm` job, from the packages `build-npm` assembles with scripts/npm-build.mjs, under npm/onemessagebus-cli/package.json's name."
manifest = "npm/onemessagebus-cli/package.json"
covers = [
  "npm:onemessagebus-cli-linux-x64",
  "npm:onemessagebus-cli-linux-arm64",
  "npm:onemessagebus-cli-darwin-x64",
  "npm:onemessagebus-cli-darwin-arm64",
  "npm:onemessagebus-cli-win32-x64",
]

[[target]]
id = "pypi:onemessagebus"
name = "sdk"
what = "The typed async Python SDK over the onemessagebus binary — one client method per capability, message types declared as Pydantic models, subscriptions over the resident core — installed with `pip install onemessagebus`, pinning the exact onemessagebus-cli release it drives."
published_by = "release.yml's `publish-python-sdk` job, from the distribution `build-python-sdk` packs from python/onemessagebus-sdk, under python/onemessagebus-sdk/pyproject.toml's [project] name."
manifest = "python/onemessagebus-sdk/pyproject.toml"

[[target]]
id = "npm:@onemessagebus/sdk"
name = "node-sdk"
what = "The typed TypeScript SDK over the onemessagebus binary — one client method per capability, message types declared with Zod through `defineMessage`, subscriptions over the resident core — installed with `npm install @onemessagebus/sdk`, pinning the exact onemessagebus-cli release it drives."
published_by = "release.yml's `publish-node-sdk` job, from the tarball `build-node-sdk` packs from npm/onemessagebus-sdk, under npm/onemessagebus-sdk/package.json's name."
manifest = "npm/onemessagebus-sdk/package.json"
