# Automated releases from conventional commits, driven by release-plz.
#
# Flow:
#   1. Commits land on `main` (pre-1.0: feat -> minor, fix/perf/refactor/build ->
#      patch, `!`/BREAKING -> minor; chore/docs/ci/test/style do not release).
#      release-plz only *sees* a commit that touched a crate's packaged files,
#      so what releases is governed by `[package] include` in each crate's
#      Cargo.toml. See AGENTS.md.
#   2. The `release-pr` job opens/updates a PR that bumps the workspace version
#      in Cargo.toml + Cargo.lock and writes the CHANGELOG section.
#   3. Merging that PR makes the `release` job tag `vX.Y.Z` and cut a GitHub
#      Release with the changelog notes. That Release (created with a PAT, not the
#      default GITHUB_TOKEN) triggers release.yml, which builds and publishes the
#      binaries, the wheels, and the npm packages.

[workspace]
# release-plz only versions, changelogs, tags, and cuts the GitHub Release — it
# never runs `cargo publish`. crates.io publishing is a separate step: the
# `publish-crate` job in release.yml, which self-activates when the
# CARGO_REGISTRY_TOKEN secret is set. Keeping it out of release-plz decouples
# versioning/tagging from the registry push.
publish = false

# API breaking-change detection: cargo-semver-checks compares the surface against
# the last released version, and release-plz bumps on what it finds rather than on
# the commit type alone — which cannot see a break the author did not mark.
# release-plz.yml installs the tool beside release-plz; without it the check is
# silently skipped.
semver_check = true

git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"

# The release PR's branch prefix, stated rather than left to the default: ci.yml
# gives that PR the full sweep and release-plz.yml auto-merges it by this prefix,
# and npm/test/release-configuration.test.mjs holds both to this one value.
pr_branch_prefix = "release-plz-"

# Keep-a-Changelog-style grouping. The version bump is computed from the
# conventional-commit *type*, independent of these display groups.
[changelog]
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", skip = true },
  { message = "^ci", skip = true },
  { message = "^chore", skip = true },
  { message = "^build", skip = true },
  { message = "^style", skip = true },
  { body = ".*", group = "Other" },
]

# The changelog lives at the repository root, where the release archive's
# `include` in release.yml resolves it from, and where a reader arriving at the
# repository looks. The core crate is the one published crate, and its Release
# is what fires release.yml.
[[package]]
name = "onemessagebus"
changelog_path = "CHANGELOG.md"
