[package]
name = "onemessagebus-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The agent profile over the onemessagebus core: the envelope, labels, sources, phases and schema registry the agent stack shares."
readme = "README.md"
keywords = ["ndjson", "events", "message-bus", "agent"]
categories = ["development-tools", "encoding"]
include = ["src/**/*.rs", "Cargo.toml", "README.md"]

[lib]
name = "onemessagebus_agent"
path = "src/lib.rs"

# The core, and nothing else of the stack: this crate declares the agent
# vocabulary over the core's public API and depends on no sibling. It carries
# no binary and no clap; `crates/onemessagebus-cli` links it for the command line.
[dependencies]
onemessagebus = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
serde_norway = { workspace = true }
