# The `onemessagebus` binary: the command line over the core. Unpublished —
# shipped through the release archives, the PyPI wheel (`onemessagebus-cli`) and
# the npm launcher (`onemessagebus-cli`), with `cargo install --git` as the
# crates-free path — so the core stays a library every consumer can depend on
# without pulling clap.
[package]
name = "onemessagebus-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The onemessagebus command line: schema registry verbs and NDJSON stream verbs over the core."
publish = false

[lib]
name = "onemessagebus_cli"
path = "src/lib.rs"

[[bin]]
name = "onemessagebus"
path = "src/main.rs"

[dependencies]
onemessagebus = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# The resident core binds its socket, records its pid, and only then listens, so
# a client that sees it answer can rely on the pid file. std's `UnixListener::bind`
# binds and listens in one call and this crate forbids unsafe code, so the
# separate calls are rustix's safe ones. `fs` names `O_NONBLOCK` for the open of
# the lock file the resident claims its socket with, which differs by platform.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "net"] }

[dev-dependencies]
schemars = { workspace = true }
tempfile = { workspace = true }
