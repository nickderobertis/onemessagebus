# The compiled-binary journeys. Never published: a `publish = false` workspace
# member holding only `tests/`, whose `test` target depends on the binary crate's
# `build` so every journey drives a freshly built artifact.
[package]
name = "onemessagebus-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
# No library: this crate is its journeys, and the transport plugin executable
# they point the binary at.
path = "src/lib.rs"

# The `dirfiles` transport plugin (src/bin/): the transport tests/plugin_transport.rs
# implements outside the core, served over the plugin protocol. Integration tests
# reach it as `CARGO_BIN_EXE_onemessagebus-transport-dirfiles`.
[dependencies]
onemessagebus = { workspace = true }

# llmlint: ignore[new_command_or_client_gets_its_own_project] this is neither a command the tool exposes nor a client for an external system: it is a test double, the third transport the journeys of this publish = false test project spawn as a plugin, with no tests, network or users of its own; the task requires that transport to be written in this project's tests/plugin_transport.rs, so a project of its own could only reach back into this one's test file, and nothing outside this suite ever selects it.
[[bin]]
name = "onemessagebus-transport-dirfiles"
path = "src/bin/onemessagebus-transport-dirfiles.rs"
# No tests of its own: its transport is tested where it is written,
# tests/plugin_transport.rs, whose journeys need Cargo's path to this binary.
test = false

[dev-dependencies]
onemessagebus = { workspace = true }
onemessagebus-agent = { workspace = true }
# The binary the journeys spawn, resolved by Cargo as `CARGO_BIN_EXE_onemessagebus`.
onemessagebus-cli = { workspace = true }
assert_cmd = { workspace = true }
predicates = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tempfile = { workspace = true }

# One test binary rather than one per file, so the fixture is a module the
# journeys share rather than a file each of them compiles its own copy of.
[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
