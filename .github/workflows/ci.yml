name: CI

# Pull requests run the affected tier; the release PR — the commit that ships —
# gets the full sweep, once. A push to main runs nothing here, and nothing runs on
# a schedule: every commit on main arrived through a gated pull request, and
# gating it again would re-sweep a tree the merge already proved. The README's
# install one-liner, which needs the code on the remote, is proven by
# install-documented.yml on Linux and Windows, and this PR
# workflow on Mac against its exact head.
on:
  pull_request:

# Least privilege: most jobs only need to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which projects this pull request's diff can reach, derived once so every
  # Rust-artifact job below can skip on a change that cannot touch a crate
  # instead of paying the full matrix — at job level where one context is
  # reported, step by step where a matrix leg's context is required by name.
  #
  # `just affected-crate` fails closed: with no derivable merge base — a shallow
  # clone, a missing base branch — it says the crate is affected and the matrices
  # run. Affected selection is a speed optimisation, and one that can silently
  # skip a check is a correctness hole.
  changes:
    runs-on: ubuntu-latest
    outputs:
      crate: ${{ steps.affected.outputs.crate }}
      sdk: ${{ steps.affected.outputs.sdk }}
      macos: ${{ steps.policy.outputs.macos }}
      release-only: ${{ steps.policy.outputs.release-only }}
    steps:
      - uses: actions/checkout@v4
        with:
          # `nx affected` needs the merge base, which a shallow checkout does not
          # have.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Install through crates.io, not the GitHub release-download path used by
      # setup-just/install-action. That path can be down without blocking a gate.
      - uses: ./.github/actions/setup-just
      - name: Classify the PR's actual content
        id: policy
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node .github/macos-policy.mjs classify --event "$GITHUB_EVENT_PATH" --base "$BASE" --head "$HEAD" > policy.json
          echo "macos=$(node -p 'String(JSON.parse(require("fs").readFileSync("policy.json")).macosRequired)')" >> "$GITHUB_OUTPUT"
          echo "release-only=$(node -p 'String(JSON.parse(require("fs").readFileSync("policy.json")).isReleaseOnly)')" >> "$GITHUB_OUTPUT"
      - name: Which projects the diff reaches
        id: affected
        run: |
          echo "crate=$(just affected-crate)" >> "$GITHUB_OUTPUT"
          echo "sdk=$(just affected-sdk)" >> "$GITHUB_OUTPUT"

  # The gate on a clean checkout: bootstrap from scratch, then the deterministic
  # gate (format, clippy, tests incl. e2e with the coverage threshold, docs).
  # Affected projects on an ordinary pull request; every project on the release
  # PR, because release-plz batches merges behind it and its commit is the one
  # that ships.
  #
  # Linux-only because coverage is measured here; macOS/Windows prove the artifact
  # via the `cross` job below.
  gate:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest,cargo-llvm-cov
      - uses: ./.github/actions/setup-just
      # onemessagebus-pypi's targets build the wheel with maturin through uvx and
      # install it into a uv virtualenv, and the Python SDK's tiers run under uv.
      - uses: astral-sh/setup-uv@v6
      # The TypeScript SDK's tiers run under bun, and the cross-language journey
      # spawns bun and uv beside the binary. Its version is .bun-version's.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Bootstrap
        run: just bootstrap
      - name: Quality gate (affected projects)
        if: needs.changes.outputs.release-only != 'true'
        run: just check-affected
      - name: Quality gate (every project)
        if: needs.changes.outputs.release-only == 'true'
        run: just check
      # A committed lockfile that `just bootstrap`/`just check` had to change is a
      # stale generated file; fail rather than let it drift.
      - name: Committed generated files are up to date
        run: git diff --exit-code -- Cargo.lock package-lock.json

  # Windows artifact assertions; Mac assertions run sequentially in macos-proof.
  cross:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ needs.changes.outputs.crate == 'true' && matrix.os || 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Nothing to prove (the diff reaches no crate)
        if: needs.changes.outputs.crate != 'true'
        run: echo "the diff reaches no crate, so cross has nothing to build or test for ${{ matrix.os }}"
      - uses: actions/checkout@v4
        if: needs.changes.outputs.crate == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.crate == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.crate == 'true'
        with:
          node-version: "22"
      - uses: taiki-e/install-action@v2
        if: needs.changes.outputs.crate == 'true'
        with:
          tool: nextest
      - uses: ./.github/actions/setup-just
        if: needs.changes.outputs.crate == 'true'
      # The SDK projects bootstrap with bun and uv, and on macOS the
      # cross-language journey spawns both.
      - uses: astral-sh/setup-uv@v6
        if: needs.changes.outputs.crate == 'true'
      - uses: oven-sh/setup-bun@v2
        if: needs.changes.outputs.crate == 'true'
        with:
          bun-version-file: .bun-version
      - name: Bootstrap
        if: needs.changes.outputs.crate == 'true'
        run: just bootstrap
      - name: Tests (every crate and the npm packaging)
        if: needs.changes.outputs.crate == 'true'
        # llmlint: ignore[no_second_broader_sweep_over_an_already_gated_commit] not the same sweep twice: `gate` runs on ubuntu alone, and this is the only run of the suites on macOS and Windows, which the create-repo CI guidance requires for a cross-platform binary; formatting, lints and coverage are platform-independent and are not repeated here.
        run: just test-uninstrumented

  # The declared MSRV is a promise to consumers, so prove it rather than document
  # it: a floor that only lives in Cargo.toml drifts the first time a dependency
  # raises its own.
  msrv:
    needs: changes
    if: needs.changes.outputs.crate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the MSRV from Cargo.toml
        id: msrv
        run: |
          version="$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml)"
          [ -n "$version" ] || { echo "::error::Cargo.toml declares no rust-version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-just
      # `just msrv` reads the same `rust-version` field, so the recipe and the job
      # can never disagree about which floor was proven.
      - run: just msrv

  # Advisory + license audit and unused-dependency check. Its own Linux-only job:
  # it needs a network advisory DB and must not be duplicated across the matrix.
  deny:
    needs: changes
    if: needs.changes.outputs.crate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete
      - uses: ./.github/actions/setup-just
      - run: just deps-check

  # Prove the end-user install path on every platform: install the binary the
  # documented way and smoke-test the real artifact with the same script the
  # release verify jobs run against PyPI and npm. `cargo install --path` is the
  # same code path as the documented `cargo install --git`, minus the fetch — so
  # the path users take is exercised on every PR, not only after a release.
  #
  # Like `cross`, no job-level condition: each leg's context is required by
  # name, so every leg runs on every change and a crate-free one succeeds through
  # the single step that says there is nothing to install — on ubuntu-latest,
  # for the reason `cross` gives, since the matrix names the context whichever
  # runner reports it.
  install:
    needs: [changes, gate]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ needs.changes.outputs.crate == 'true' && matrix.os || 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Nothing to prove (the diff reaches no crate)
        if: needs.changes.outputs.crate != 'true'
        run: echo "the diff reaches no crate, so install has nothing to install or smoke-test for ${{ matrix.os }}"
      - uses: actions/checkout@v4
        if: needs.changes.outputs.crate == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.crate == 'true'
      # On a PR the change is not on the remote yet, so `--path` is the only way to
      # install *this* revision.
      - name: Install (this revision)
        if: needs.changes.outputs.crate == 'true'
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo install --path crates/onemessagebus-cli --locked
      - name: Smoke-test the installed binary
        if: needs.changes.outputs.crate == 'true'
        run: |
          version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)"
          bash scripts/smoke-published.sh \
            --expect-version "$version" \
            --label "cargo install onemessagebus-cli $version on $RUNNER_OS/$RUNNER_ARCH"

  # The PyPI path on every PR: build the wheel maturin will publish from this
  # revision, install it, and smoke-test what it put on PATH.
  wheel:
    needs: changes
    if: needs.changes.outputs.crate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: ./.github/actions/setup-just
      - uses: astral-sh/setup-uv@v6
      # The repository's own wheel journey: onemessagebus-pypi builds the wheel
      # with maturin, and onemessagebus-pypi-e2e installs it into a fresh
      # virtualenv and smoke-tests what it put on PATH.
      - name: Build, install and smoke-test the wheel
        run: just nx run onemessagebus-pypi-e2e:test

  # The Linux SDK install journey retains its own affected selection.
  # llmlint: ignore-block[live_tier_compiles_and_requires_credential, external_service_suite_stays_out_of_the_affected_tier] the suite this job runs tests artifacts built from this checkout — both SDKs packed at this revision and installed beside the binary built from it — and calls no external service: its only network use is the package registries, read anonymously for the SDKs' third-party dependencies (pydantic, zod), the same provisioning `just bootstrap` does in every job. So there is no credential to demand and no absence that could skip it green, since every step of its one recipe exits non-zero on failure. It gates pull requests deliberately, so both packages' documented install paths are proven on every change that can reach them, and it does so from this job of its own, selected by the changes filter: the affected-tier `check-affected` gate excludes it.
  sdk-install:
    needs: [changes, gate]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ (needs.changes.outputs.crate == 'true' || needs.changes.outputs.sdk == 'true') && matrix.os || 'ubuntu-latest' }}
    steps:
      - name: Nothing to prove (the diff reaches neither the binary nor an SDK)
        if: needs.changes.outputs.crate != 'true' && needs.changes.outputs.sdk != 'true'
        run: echo "the diff reaches neither the binary nor an SDK, so sdk-install has nothing to pack or smoke-test for ${{ matrix.os }}"
      - uses: actions/checkout@v4
        if: needs.changes.outputs.crate == 'true' || needs.changes.outputs.sdk == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.crate == 'true' || needs.changes.outputs.sdk == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.crate == 'true' || needs.changes.outputs.sdk == 'true'
        with:
          node-version: "22"
      - uses: ./.github/actions/setup-just
        if: needs.changes.outputs.crate == 'true' || needs.changes.outputs.sdk == 'true'
      - uses: astral-sh/setup-uv@v6
        if: needs.changes.outputs.crate == 'true' || needs.changes.outputs.sdk == 'true'
      - uses: oven-sh/setup-bun@v2
        if: needs.changes.outputs.crate == 'true' || needs.changes.outputs.sdk == 'true'
        with:
          bun-version-file: .bun-version
      - name: Pack, install and smoke-test both SDKs
        # A release-plz PR's gate runs `just check`, which already ran this journey
        # on Ubuntu for the same commit; only the macOS leg is new there.
        if: (needs.changes.outputs.crate == 'true' || needs.changes.outputs.sdk == 'true') && (matrix.os != 'ubuntu-latest' || needs.changes.outputs.release-only != 'true')
        run: just nx run onemessagebus-sdk-install-e2e:test
  # llmlint: ignore-end[live_tier_compiles_and_requires_credential, external_service_suite_stays_out_of_the_affected_tier]

  # Lint the PR title: under squash-merge it becomes the release-driving commit.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The LLM-judge tier: a blocking PR check, separate from the deterministic
  # `check` gate. It requires its harness credential and fails fast without it — a
  # credential-less no-op would report unlinted files as clean. Fork PRs are gated
  # by the repo's require-approval-for-fork-workflows setting.
  llmlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-just
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # oneharness.toml's primary harness. Without a harness binary on PATH,
      # llmlint has nothing to drive and the job would fail with no findings —
      # which reads like a clean run. Pinned rather than floating: an upstream
      # release has taken this required check down before. Bump deliberately.
      - name: Install the Codex harness
        run: npm install -g @openai/codex@0.145.0
      # oneharness only falls through to a harness it can actually spawn, so the
      # secondary in the chain is a resilience claim the runner cannot honour
      # unless `claude` is on PATH too. With it installed, an exhausted or broken
      # codex degrades to claude-code instead of failing the check.
      - name: Install the Claude Code harness (oneharness fallback)
        run: npm install -g @anthropic-ai/claude-code@2.1.220
      - name: Install llmlint toolchain
        run: just setup-llmlint
      - name: Validate llmlint config
        run: just lint-llm-validate --diff-base origin/main
      - name: Lint changed files
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::llmlint needs OPENAI_API_KEY for the Codex harness" >&2
            exit 1
          fi
          # The fallback is only real if its credential arrived too: without it
          # claude-code is rejected at auth and falls through, leaving the chain
          # nowhere to degrade to — the same failure, but silent, because an
          # installed-yet-uncredentialled harness looks fine.
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::llmlint needs CLAUDE_CODE_OAUTH_TOKEN for the claude-code fallback harness" >&2
            exit 1
          fi
          just lint-llm-diff origin/main

  # Three protected Linux carriers report the real result of this one Mac lane.
  macos-proof:
    env:
      REQUIRED_CONTEXT: "false"
    needs: [changes, gate]
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: ./.github/actions/setup-just
      # The SDK projects bootstrap with bun and uv, and on macOS the
      # cross-language journey spawns both.
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Bootstrap
        run: just bootstrap
      - name: Tests (every crate and the npm packaging)
        if: needs.changes.outputs.crate == 'true'
        # llmlint: ignore[no_second_broader_sweep_over_an_already_gated_commit] not the same sweep twice: `gate` runs on ubuntu alone, and this is the only run of the suites on macOS and Windows, which the create-repo CI guidance requires for a cross-platform binary; formatting, lints and coverage are platform-independent and are not repeated here.
        run: just test-uninstrumented

      - name: Install (this revision)
        if: needs.changes.outputs.crate == 'true'
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo install --path crates/onemessagebus-cli --locked
      - name: Smoke-test the installed binary
        if: needs.changes.outputs.crate == 'true'
        run: |
          version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)"
          bash scripts/smoke-published.sh \
            --expect-version "$version" \
            --label "cargo install onemessagebus-cli $version on $RUNNER_OS/$RUNNER_ARCH"

      - name: Install (the command the README gives users)
        env:
          RUSTFLAGS: "-D warnings"
          PR_REPOSITORY: ${{ github.event.pull_request.head.repo.clone_url }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          documented=$(grep -m1 '^cargo install --git ' README.md || true)
          if [[ -z $documented ]]; then
            echo "README.md's Install section no longer gives a 'cargo install --git' one-liner, so there is nothing for this job to prove — restore it or drop this job" >&2
            exit 1
          fi
          # README.md is committed, but it is still file-derived input: accept
          # only a plain argv of unambiguous characters, then run it as an argv.
          # Nothing in that file is ever handed to the shell to interpret.
          if [[ $documented =~ [^A-Za-z0-9._:/@=+[:space:]-] ]]; then
            echo "README.md's install one-liner carries characters this job will not run: $documented" >&2
            exit 1
          fi
          read -r -a argv <<<"$documented"
          echo "running README.md's command: ${argv[*]}"
          for i in "${!argv[@]}"; do
            if [[ ${argv[$i]} == --git ]]; then argv[i+1]="$PR_REPOSITORY"; fi
          done
          "${argv[@]}" --rev "$PR_HEAD" --force
      - name: Smoke-test the installed binary
        run: bash scripts/smoke-published.sh --label "cargo install --git on $RUNNER_OS/$RUNNER_ARCH"

      - name: Pack, install and smoke-test both SDKs
        if: needs.changes.outputs.crate == 'true' || needs.changes.outputs.sdk == 'true'
        run: just nx run onemessagebus-sdk-install-e2e:test

  cross-macos:
    name: cross (macos-latest)
    needs: [changes, gate, macos-proof]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report the Mac lane result
        env:
          REQUIRED: ${{ needs.changes.outputs.macos }}
          CHANGES: ${{ needs.changes.result }}
          GATE: ${{ needs.gate.result }}
          PROOF: ${{ needs.macos-proof.result }}
        run: node .github/macos-result.mjs "$REQUIRED" "$CHANGES" "$GATE" "$PROOF"

  install-macos:
    name: install (macos-latest)
    needs: [changes, gate, macos-proof]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report the Mac lane result
        env:
          REQUIRED: ${{ needs.changes.outputs.macos }}
          CHANGES: ${{ needs.changes.result }}
          GATE: ${{ needs.gate.result }}
          PROOF: ${{ needs.macos-proof.result }}
        run: node .github/macos-result.mjs "$REQUIRED" "$CHANGES" "$GATE" "$PROOF"

  sdk-install-macos:
    name: sdk-install (macos-latest)
    needs: [changes, gate, macos-proof]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report the Mac lane result
        env:
          REQUIRED: ${{ needs.changes.outputs.macos }}
          CHANGES: ${{ needs.changes.result }}
          GATE: ${{ needs.gate.result }}
          PROOF: ${{ needs.macos-proof.result }}
        run: node .github/macos-result.mjs "$REQUIRED" "$CHANGES" "$GATE" "$PROOF"
